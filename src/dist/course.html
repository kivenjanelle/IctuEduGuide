<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Courses - ICTU EduGuide</title>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #120d1f;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
    }
    h1 { color: #c9a84c; text-align: center; margin-bottom: 40px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .course-card {
      background: #1e1833;
      padding: 25px;
      border-radius: 16px;
      transition: 0.3s;
    }
    .course-card:hover {
      transform: translateY(-8px);
      background: #2a2344;
    }
    .code {
      color: #c9a84c;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 ICT Courses</h1>
    
    <div class="grid">
      <div class="course-card">
        <span class="code">CS101</span>
        <h3>Introduction to Programming</h3>
        <p>Level 1 • 3 Credits</p>
        <button onclick="alert('Opening course details...')">View Past Questions</button>
      </div>

      <div class="course-card">
        <span class="code">NET202</span>
        <h3>Computer Networks</h3>
        <p>Level 2 • 4 Credits</p>
        <button onclick="alert('Opening course details...')">View Past Questions</button>
      </div>

      <div class="course-card">
        <span class="code">CYB301</span>
        <h3>Cybersecurity Fundamentals</h3>
        <p>Level 3 • 3 Credits</p>
        <button onclick="alert('Opening course details...')">View Past Questions</button>
      </div>
    </div>

    <div style="text-align:center; margin-top: 50px;">
      <button onclick="window.location.href='index.html'" style="padding:12px 30px; font-size:16px;">
        ← Logout
      </button>
    </div>
  </div>
</body>
</html>
